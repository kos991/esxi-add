services:
  app:
    image: ${APP_IMAGE:-ghcr.io/kos991/esxi-add:latest}
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      SERVER_HOST: ${SERVER_HOST:-0.0.0.0}
      PORT: ${PORT:-8080}
      API_TOKEN: ${API_TOKEN:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      REDIS_URL: ${REDIS_URL:-redis://127.0.0.1:6379}
      DB_PATH: ${DB_PATH:-/data/db/esxi-builder.db}
      STORAGE_TYPE: ${STORAGE_TYPE:-local}
      STORAGE_PATH: ${STORAGE_PATH:-/data/storage}
      CACHE_DIR: ${CACHE_DIR:-/data/builds}
      BUILD_MODE: ${BUILD_MODE:-local}
      WORKER_TOKEN: ${WORKER_TOKEN:-}
      FRONTEND_DIST_DIR: ${FRONTEND_DIST_DIR:-/app/frontend/dist}
    volumes:
      - esxi-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  esxi-data:
