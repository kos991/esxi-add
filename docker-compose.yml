services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: esxi-iso-builder:all-in-one
    ports:
      - "${APP_PORT:-8080}:8080"
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      PORT: "8080"
      REDIS_URL: "${REDIS_URL:-redis://127.0.0.1:6379}"
      DB_PATH: "${DB_PATH:-/data/db/esxi-builder.db}"
      STORAGE_TYPE: "${STORAGE_TYPE:-local}"
      STORAGE_PATH: "${STORAGE_PATH:-/data/storage}"
      CACHE_DIR: "${CACHE_DIR:-/data/builds}"
      BUILD_MODE: "${BUILD_MODE:-local}"
      WORKER_TOKEN: "${WORKER_TOKEN:-}"
      FRONTEND_DIST_DIR: "${FRONTEND_DIST_DIR:-/app/frontend/dist}"
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-minioadmin}"
      DEFAULT_S3_ENDPOINT: "${DEFAULT_S3_ENDPOINT:-127.0.0.1:9000}"
      DEFAULT_S3_ACCESS_KEY: "${DEFAULT_S3_ACCESS_KEY:-minioadmin}"
      DEFAULT_S3_SECRET_KEY: "${DEFAULT_S3_SECRET_KEY:-minioadmin}"
      DEFAULT_S3_BUCKET: "${DEFAULT_S3_BUCKET:-esxi-builder}"
      DEFAULT_S3_REGION: "${DEFAULT_S3_REGION:-us-east-1}"
      DEFAULT_S3_USE_SSL: "${DEFAULT_S3_USE_SSL:-false}"
      DEFAULT_S3_PUBLIC_DOMAIN: "${DEFAULT_S3_PUBLIC_DOMAIN:-http://localhost:9000}"
    volumes:
      - esxi-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  esxi-data:
